services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://dual:dual@mongodb:27017/dual_workspace?authSource=admin
      MONGODB_DB: dual_workspace
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: dual
      MONGO_INITDB_ROOT_PASSWORD: dual
      MONGO_INITDB_DATABASE: dual_workspace
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
volumes:
  mongo-data:
